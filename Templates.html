<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snipzo — Templates</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="lab-header">
  <div class="lab-title">
    <h1>Snipzo</h1>
    <span>Templates — नीचे बटन से दूसरे पेज पर जाएँ</span>
  </div>
  <div class="lab-nav">
    <button onclick="go('splash')">Splash Screen</button>
    <button onclick="go('login')">Login</button>
    <button onclick="go('home')">Home</button>
    <button onclick="go('editor')">Video Editor</button>
    <button onclick="go('tools')">Tools</button>
    <button class="active" onclick="go('templates')">Templates</button>
    <button onclick="go('export')">Export</button>
    <button onclick="go('projects')">Projects</button>
    <button onclick="go('profile')">Profile / Settings</button>
  </div>
</div>

<div class="stage">
  <div class="phone">
    <section class="screen active" id="screen-templates">
      <div class="statusbar"><span>9:41</span><div class="icons">📶 📡 🔋</div></div>
      <div class="screen-body">
        <div class="subpage-head"><span class="back-arrow" onclick="go('home')">←</span><h2>Templates</h2></div>
        <div class="search-bar">🔍 Search templates...</div>
        <div class="pill-tabs">
          <div class="pill active">Trending</div>
          <div class="pill">Reels</div>
          <div class="pill">Vlog</div>
          <div class="pill">Birthday</div>
          <div class="pill">Business</div>
        </div>
        <div class="tmpl-grid">
          <div class="tmpl-card" style="background-image:url('https://images.unsplash.com/photo-1470770903676-69b98201ea1c?w=300')" onclick="go('editor')">
            <div class="veil"></div><div class="info">Cinematic Travel<small>00:16</small></div>
          </div>
          <div class="tmpl-card" style="background-image:url('https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=300')" onclick="go('editor')">
            <span class="crown">👑</span><div class="veil"></div><div class="info">Birthday Special<small>00:20</small></div>
          </div>
          <div class="tmpl-card" style="background-image:url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=300')" onclick="go('editor')">
            <div class="veil"></div><div class="info">Love Story<small>00:18</small></div>
          </div>
          <div class="tmpl-card" style="background-image:linear-gradient(135deg,#1e0a3c,#5b0e6b)">
            <span class="crown">👑</span><div class="veil"></div><div class="info" style="color:#e879f9">GAME ON<small style="color:rgba(255,255,255,.6)">Gaming Intro · 00:12</small></div>
          </div>
          <div class="tmpl-card" style="background-image:url('https://images.unsplash.com/photo-1522337660859-02fbefca4702?w=300')" onclick="go('editor')">
            <div class="veil"></div><div class="info">Fashion Look<small>00:18</small></div>
          </div>
          <div class="tmpl-card" style="background-image:url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=300')" onclick="go('editor')">
            <div class="veil"></div><div class="info">Nature Vibes<small>00:20</small></div>
          </div>
        </div>
      </div>
      <div class="bottom-tabs">
        <div class="tab" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>Home</div>
        <div class="tab" onclick="go('projects')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Projects</div>
        <div class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>Templates</div>
        <div class="tab" onclick="go('profile')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>Profile</div>
      </div>
    </section>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
