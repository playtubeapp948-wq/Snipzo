<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snipzo — Login</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="lab-header">
  <div class="lab-title">
    <h1>Snipzo</h1>
    <span>Login — नीचे बटन से दूसरे पेज पर जाएँ</span>
  </div>
  <div class="lab-nav">
    <button onclick="go('splash')">Splash Screen</button>
    <button class="active" onclick="go('login')">Login</button>
    <button onclick="go('home')">Home</button>
    <button onclick="go('editor')">Video Editor</button>
    <button onclick="go('tools')">Tools</button>
    <button onclick="go('templates')">Templates</button>
    <button onclick="go('export')">Export</button>
    <button onclick="go('projects')">Projects</button>
    <button onclick="go('profile')">Profile / Settings</button>
  </div>
</div>

<div class="stage">
  <div class="phone">
    <section class="screen active" id="screen-login">
      <div class="statusbar"><span>9:41</span><div class="icons">📶 📡 🔋</div></div>
      <div class="screen-body">
        <div class="login-mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M8 5l11 7-11 7V5z" fill="#fff"/></svg>
        </div>
        <div class="login-h">Welcome Back</div>
        <div class="login-sub">Sign in to continue to Snipzo</div>

        <button class="oauth-btn" onclick="go('home')">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.07 5.07 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.25 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.85A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.44.34-2.1V7.05H2.18A11 11 0 0 0 1 12c0 1.77.43 3.45 1.18 4.95l3.66-2.85z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.05l3.66 2.85C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
          Continue with Google
        </button>
        <button class="oauth-btn" onclick="go('home')">
          <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M24 5.5v13a2.5 2.5 0 0 1-2.5 2.5H21V8l-9 6-9-6v13H2.5A2.5 2.5 0 0 1 0 18.5v-13C0 4.12 1.12 3 2.5 3h.7L12 9.5 20.8 3h.7C22.88 3 24 4.12 24 5.5z"/></svg>
          Continue with Gmail
        </button>

        <div class="divider-row"><div class="ln"></div>or<div class="ln"></div></div>

        <button class="email-btn" onclick="go('home')">✉️ Sign in with Email</button>

        <div class="signup-line">Don't have an account? <b>Sign Up</b></div>
      </div>
    </section>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
